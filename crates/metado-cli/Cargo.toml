[package]
name = "metado-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mdl"
path = "src/main.rs"

[features]
# 文件监听（notify 权重高、Termux 下更省内存：默认不启，mdl watch 时 --features watch）
watch = ["dep:notify"]

[dependencies]
metado-engine = { path = "../metado-engine" }
metado-cap-log = { path = "../metado-cap-log" }
metado-cap-time = { path = "../metado-cap-time" }
metado-cap-crypto = { path = "../metado-cap-crypto" }
metado-cap-storage = { path = "../metado-cap-storage" }
metado-cap-file = { path = "../metado-cap-file" }
metado-cap-http = { path = "../metado-cap-http" }
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zip = { workspace = true }
notify = { workspace = true, optional = true }