[workspace]
resolver = "2"
members = [
    "crates/metado-engine",
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
sha2 = "0.11.0"
hex = "0.4.3"
rand = "0.10.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
thiserror = "2.0.20"

# zip 9.0.0-pre3 is pre-release; 8.6.0 is the latest stable (needs Rust >= 1.88).
# Only Stored + Deflate needed for v1 container reads -> keep features lean.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# --- Phase 2: JS executor (boa >= 0.19 renamed `boa` -> `boa_engine`) ---
boa_engine = "0.22.0"

# --- Phase 2/3/5: async runtime + HTTP capability ---
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }

# --- Phase 3: metado-cap-crypto (hmac 0.13 pairs with sha2 0.11, both on digest 0.11) ---
hmac = "0.13.0"

# --- Phase 4: CLI (clap) + `mdl watch` (notify 9.x is rc; 8.2.0 is latest stable) ---
clap = { version = "4.6.7", features = ["derive"] }
notify = "8.2.0"
